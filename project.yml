# XcodeGen spec. Run `xcodegen generate` in this folder to produce Tape.xcodeproj.
# (brew install xcodegen). Or skip it and follow the manual steps in README.md.
name: Tape
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TapeCore:
    path: .
targets:
  Tape:
    type: application
    platform: iOS
    sources:
      - path: App/Tape
    dependencies:
      - package: TapeCore
        product: TapeCore
    info:
      path: App/Tape/Info.plist
      properties:
        CFBundleDisplayName: Tape
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tape
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: true
  TapeCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TapeCoreTests
    dependencies:
      - package: TapeCore
        product: TapeCore
    settings:
      base:
        # The test bundle has no Info.plist of its own; without this, signing fails on Cmd-U.
        GENERATE_INFOPLIST_FILE: true
schemes:
  Tape:
    build:
      targets:
        Tape: all
        TapeCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TapeCoreTests
